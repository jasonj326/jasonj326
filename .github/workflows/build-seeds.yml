name: Build seeds

# Auto-rebuild seeds/seeds.json when source posts or the build script change.
# Loop prevention: this job only commits seeds/seeds.json, which doesn't match
# the paths filter, so the resulting commit doesn't re-trigger.

on:
  push:
    branches: [main]
    paths:
      - 'seeds/posts/**'
      - 'scripts/build-seeds.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build seeds.json
        run: python3 scripts/build-seeds.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain seeds/seeds.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add seeds/seeds.json
            git commit -m "chore: auto-rebuild seeds.json [skip ci]"
            git push
          else
            echo "seeds.json unchanged — nothing to commit"
          fi
